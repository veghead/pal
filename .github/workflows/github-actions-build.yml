name: run-tests
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v2
      - run: echo "${{ github.repository }}"
      - name: List files in the repository
        id: task1
        run: |
          ls ${{ github.workspace }}
      - name: List files in the repository
        id: task2
        run: |
          ls ${{ github.workspace }}
          false
      - name: status
        run: echo "${{ steps.task1.status }}."
      - name: status
        run: echo "${{ steps.task2.status }}."

