name: run-tests
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v2
      - run: echo "${{ github.repository }}"
      - name: List files in the repository
        id: taska
        run: |
          ls ${{ github.workspace }}
      - name: List files in the repository
        id: taskb
        if: ${{ always() }}
        run: |
          ls ${{ github.workspace }}
          false
      - name: status
        if: ${{ always() }}
        run: echo "${{ steps.taska.status }}."
      - name: status
        if: ${{ always() }}
        run: echo "${{ steps.taskb.status }}."

